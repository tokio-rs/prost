[package]
name = "benchmarks"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = ["size-cache"]
size-cache = ["prost/size-cache"]

[dependencies]

[build-dependencies]
prost-build = { path = "../prost-build" }

[dev-dependencies]
prost = { path = "../prost", default-features = false, features = ["derive", "std"] }
criterion = { version = "0.8", default-features = false }

[lib]
# https://bheisler.github.io/criterion.rs/book/faq.html#cargo-bench-gives-unrecognized-option-errors-for-valid-command-line-options
bench = false

[[bench]]
name = "dataset"
harness = false

[[bench]]
name = "nested"
harness = false
